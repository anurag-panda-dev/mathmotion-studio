<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="MathMotion Studio — a local-first, AI-assisted mathematics animation studio for teachers."
    />
    <title>MathMotion Studio</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Mirrors src/hooks/useTheme.tsx (localStorage key).
      ;(function () {
        try {
          var stored = localStorage.getItem("mathmotion-theme-preference")
          var dark =
            stored === "dark" ||
            ((stored === "system" || !stored) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {
          /* storage unavailable — fall back to the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
