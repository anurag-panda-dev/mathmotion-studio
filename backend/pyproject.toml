[project]
name = "mathmotion-backend"
version = "0.1.0"
description = "MathMotion Studio backend — local-first scene.md validation and Manim rendering service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.22,<5.0",
    "sympy>=1.12,<2.0",
    "numpy>=1.26,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
render = ["manim>=0.19.0,<0.20"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/rendering/scene_template.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long strings in prompts/messages are intentional
    "B008",   # FastAPI default-argument pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
